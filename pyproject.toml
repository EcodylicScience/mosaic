[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-behavior"
version = "0.12.0"
description = "Mosaic — behavior analysis toolkit for animal tracking, feature extraction, and modeling."
readme = "README.md"
requires-python = ">=3.12"
# PEP 639. The SPDX expression replaces both the deprecated `{ file = ... }`
# table and the `License ::` trove classifier, which cannot coexist with an
# expression -- setuptools raises rather than warns. `license-files` ships both
# documents in the wheel, and every listed file must exist or the build fails.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ecodylic Science" }]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "pyarrow>=11.0",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "numba>=0.58",
    "matplotlib>=3.7",
    "openTSNE>=0.6",
    # Bounded deliberately. `>=4.7` alone now resolves to OpenCV 5, so the
    # major version this project is tested against was being chosen by the
    # resolver rather than declared. Raise the ceiling on purpose, with a run
    # of the media suites behind it.
    "opencv-python>=4.7,<6",
    # `core/annotations/readers/yolo_pose.py` opens each image with PIL to read
    # its size. Core rather than an extra: reading annotations is not gated on
    # any integration, and it arrived only transitively through `ultralytics`,
    # so an install without `pose` met an ImportError on a core path.
    "pillow>=10.0",
    "imbalanced-learn>=0.11",
    "xgboost>=1.7",
    # Spectral features (`pair-wavelet`), the SLEAP analysis reader, and the
    # DeepLabCut HDF5 export reader. Core rather than extras: all three are
    # numpy-only and about 30 MB together, and each one gates *reading a file
    # the user already has* rather than an integration they opted into. An
    # extra that cheap buys nothing but a way to get the install wrong.
    "PyWavelets>=1.4",
    "h5py>=3.0",
    "tables>=3.8",
    # `behavior/feature_library/temporal_stacking.py` sizes its stack against
    # free memory through it. It used to arrive transitively from
    # `ultralytics`; with the deep-learning surface out of the default install
    # an undeclared psutil turns that check into a silent no-op.
    "psutil>=5.9",
    "typer>=0.12",
    "mosaic-media[io,cli]>=0.3.3,<0.4.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.38.2",
    "joblib-stubs>=1.4.2.5.20240918",
    "microsoft-python-type-stubs",
    "pandas-stubs>=2.2.2.240807",
    "ruff>=0.15.4",
    "scipy-stubs>=1.17.1.1",
    { include-group = "docs" },
    { include-group = "test" },
]

# Its own group for the same reason `docs` is one: every CI job needs the
# runner and the fixture-writing dependency, and none of them needs the type
# stubs. `imgstore` lives here rather than in an extra because `src/` never
# imports it -- reading a store is native, and `export-store` writes through
# mosaic-media -- so the only thing that needs the package is the suite,
# which writes the fixture stores it then reads.
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
    "imgstore>=0.4",
]

# Its own group so the docs workflow can install what it needs without the type
# stubs and the test runner. `dev` includes it, so a contributor's environment is
# unchanged and the versions are still declared once.
docs = [
    "mkdocs>=1.6,<2",
    # `docs/reference/cli.md` is generated from the Typer app, and Typer's
    # metavar rendering changes between minor releases. Pinned here rather than
    # bounded in `[project.dependencies]`: the constraint belongs to generating
    # the page, not to every environment that installs mosaic. The docs job
    # installs this group after the package, so this is the version the check
    # compares against. Bumping it means regenerating the page in the same
    # change.
    "typer==0.25.1",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    # Not a linter here. mkdocstrings formats rendered signatures with Black or
    # Ruff if either is importable, and falls back to one unwrapped line if
    # neither is; `separate_signature` above is what makes that visible.
    "ruff>=0.15.4",
]

[project.optional-dependencies]
# The deep-learning surface: the torch runtime and the image backbones. Shared
# by the heatmap localizer and by all three identity models, which is why it is
# one extra rather than the two (`localizer`, `identity`) it replaces -- with
# h5py in the base they installed near-identical environments.
#
# On Linux this is where the size is: torch pulls the whole nvidia-cu12 stack,
# about 4 GB of wheels. docs/installation.md carries the CPU-only index line for
# anyone without a GPU.
deep-learning = ["torch>=2.0", "timm>=1.0"]

# Optional kNN backend for `global-tsne` (`knn_method="faiss"`; the default is
# "annoy", which needs nothing). Named for what it installs -- the old `gpu`
# name promised a GPU and delivered `faiss-cpu`. On Linux + CUDA install
# `faiss-gpu` manually instead.
faiss = ["faiss-cpu>=1.7"]

# The movement-library integration behind `movement-smooth` and
# `movement-filter-interpolate`. Both features are registered unconditionally
# and import `movement` lazily, so before this extra existed they were two
# registered features with no declared dependency at all.
#
# Outside `all` for its weight rather than any hazard: it pulls xarray, netCDF4,
# pynwb, sleap-io and napari-video for two filtering wrappers.
movement = ["movement>=0.17"]

lightning-action = ["lightning-action>=1.0"]

# FERAL V-JEPA video behavior classifier (FeralFeature, training + inference),
# from PyPI as of its 1.0.0 release.
#
# The upper bound is load-bearing rather than cautious. Mosaic builds its own
# training loop out of FERAL's pieces, so it imports thirteen symbols from
# `feral.model`, `feral.dataset`, `feral.utils`, `feral.metrics` and
# `feral.backbones`, and ten of them are submodule internals that FERAL's
# `__all__` does not carry. A major release is free to move any of them.
#
# **This extra wants an environment of its own**, and for a different reason
# from anything above: FERAL pins its dependencies exactly -- `opencv-python`,
# `pandas`, `scikit-learn`, `timm`, `matplotlib`, `transformers` -- while every
# mosaic requirement is a floor, so pip resolves the pair happily and downgrades
# each one. No install layout fixes that; install it into its own environment
# and point it at the same datasets.
feral = ["feral>=1.0,<2"]

# The documented install: everything that belongs in one general-purpose
# environment. Self-referential rather than a copied list, so it cannot drift
# from its parts -- which is what `recommended` was one careless edit away from
# at all times.
#
# Excludes, each for its own reason stated above: `lightning-action` and
# `movement` (heavy and single-purpose), and `feral` (wants its own
# environment). It reaches no AGPL-licensed distribution: YOLO pose and POLO
# point work -- tracking, inference and training alike -- runs in an environment
# you build, which no extra here can install. See
# src/mosaic/tracking/external/README.md.
all = ["mosaic-behavior[deep-learning,faiss]"]

# Deprecated in 0.12, removed in 0.13. Kept only where the name's absence would
# leave a *silently wrong* environment: pip warns about an unknown extra and
# carries on, so a saved `pip install -e ".[recommended]"` would otherwise
# produce a working install with no torch in it and no error to say so.
#
# `wavelets`, `sleap`, `hdf5` and `imgstore` are deliberately NOT aliased. The
# first three are base dependencies now, so the warning is harmless and the
# environment is right either way; `imgstore` moved to the `test` dependency
# group, being needed only to write the fixture stores the suite builds.
recommended = ["mosaic-behavior[all]"]
identity = ["mosaic-behavior[deep-learning]"]
localizer = ["mosaic-behavior[deep-learning]"]
gpu = ["mosaic-behavior[faiss]"]

# Deprecated in 0.13, removed in 0.14 -- one release behind the four above,
# because they retire here rather than there. Nothing in mosaic imports
# Ultralytics any more: the tracker, both inference ops and both training ops run
# it in the environment its model belongs to, so an extra that installed it would
# put an AGPL-licensed distribution where mosaic can never reach it from. The
# names survive for the reason `identity` and `localizer` do -- pip only *warns*
# about an unknown extra, so a saved `pip install -e ".[pose]"` would otherwise
# resolve to the base and leave a torch-less environment with no error to say so.
#
# `yolo-augment` is deliberately NOT aliased. albumentations now belongs to
# whichever environment runs the trainer, and no alias here can put it there --
# so pip's unknown-extra warning is the signal that the opt-in moved, where an
# alias would resolve happily and do nothing that was asked for. It is declared
# by both environments under `--extra augment`; see
# src/mosaic/tracking/external/README.md.
pose = ["mosaic-behavior[deep-learning]"]
polo = ["mosaic-behavior[deep-learning]"]

[project.scripts]
mosaic = "mosaic.cli:app"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
executionEnvironments = [
    { root = "src/mosaic/behavior/feature_library/external", extraPaths = ["src/mosaic/behavior/feature_library/external/.venv/lib/python3.13/site-packages"] },
    # The runner directory, because that is what resolves the bare
    # `ultralytics_protocol` import a script run from there gets for free. That
    # is the whole entry, and deliberately: the Ultralytics environment's
    # site-packages used to be listed beside it, and re-resolved numpy, pandas,
    # pydantic and mosaic-media from a second install. Those directories sit
    # under `src/mosaic/`, so their files fall under the *default* execution
    # environment and resolve their own imports from `.venv` -- which gave one
    # numpy two module identities and manufactured 13 findings in a directory
    # that has none. What the path bought was resolving the runner's deferred
    # `ultralytics` imports; those now resolve exactly the way
    # `tracking/pose_training/`'s deferred ones already do, from whatever the
    # `pose` or `polo` extra put in this environment, and report
    # `reportMissingImports` in an environment that has neither. The runner
    # types the Ultralytics surface as its own protocols anyway -- four rules are
    # disabled at the top of it because the real annotations are unusable -- so
    # checking against the built environment bought little for that cost.
    { root = "src/mosaic/tracking/external/runner", extraPaths = ["src/mosaic/tracking/external/runner"] },
]

[tool.ruff.lint]
# Pinned explicitly rather than inherited. Ruff's default selection is not
# stable across releases -- 0.16 widened it, which took this project from 97
# findings to 865 with no commit -- and CI's lint-changed job runs `uvx ruff
# check`, which always resolves the newest release. An unpinned selection means
# the gate tightens on someone else's release schedule, failing a pull request
# for findings that predate it in a file it merely touched.
#
# This is ruff's pre-0.16 default and reproduces the ~99-finding backlog the
# repository's own notes describe. Widening it is a deliberate change that
# should come with a plan for the backlog it exposes, not a side effect of a
# version bump.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
minversion = "8.0"
# Without this a bare `pytest` walks `notebooks/`, `docs/`, `site/` and the
# keypoint-MoSeq sandbox venv under `feature_library/external/` looking for tests.
testpaths = ["tests"]
# A list rather than one string: the string form nests quotes around `not slow`
# and reads as a single argument that happens to contain a space.
#
# `-m "not slow"` stays here so a bare `pytest` is the fast run CLAUDE.md
# documents. Note that a caller passing its own `-m` *replaces* this one rather
# than intersecting with it -- which is what makes `pytest -m slow` work, and
# also means `pytest -m "not media"` silently re-enables the slow tests.
# `tests/test_pytest_config.py` pins the deselection so that stays deliberate.
# `-n auto --dist worksteal` appended rather than led: the deselection has to
# stay first, and `tests/test_pytest_config.py` asserts that it is. worksteal
# balances a suite whose cases range from microseconds to a video encode, where
# a static split leaves workers idle. `-n0` runs one invocation serially.
addopts = [
    "-m",
    "not slow",
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-n",
    "auto",
    "--dist",
    "worksteal",
]
# The suite's one xfail already sets strict=True, so this only binds the next
# author: a non-strict xfail passes whether or not the bug it names is fixed.
xfail_strict = true
markers = [
    "slow: takes seconds to minutes; deselected by the default invocation",
    "media: needs the ffmpeg toolchain (both `ffmpeg` and `ffprobe`) on PATH",
    "tracker: exercises an integrated tracker's run loop behind a fake tool",
    "identity: needs torch and timm, i.e. the `deep-learning` extra",
    "feral: needs the feral package, i.e. the `feral` extra",
]
# A warning is a failure, so that the next one becomes visible at the commit that
# introduces it rather than joining a running total nobody reads. The suite emits
# 178 today and they are five things, each listed here with why it is allowed.
filterwarnings = [
    "error",
    # Mosaic's own, and deliberate: a read of an unprocessed original whose verdict
    # requires an analysis transcode. Two tests assert it is raised, so it must stay
    # a warning rather than become an error.
    "default:raw read of:UserWarning",
    # imgstore 0.4 stamps its stores with `datetime.utcnow()`. Third party, on the
    # path of every store this suite builds, and not fixable here.
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
    # imgstore 0.4 opens an in-memory sqlite index per store read
    # (`index.py:92`) and never closes it: `ImgStoreIndex` has no close method,
    # and neither `_ImgStore.close` nor `VideoImgStore.close` reaches the
    # connection. The suite's own readers all close in a `finally`, so there is
    # nothing to fix on this side short of reaching into a private attribute.
    # The garbage collector emits this whenever it finalizes the abandoned
    # connection, which is an arbitrary allocation inside an unrelated test --
    # so it cannot be scoped to a module, and as an error it failed a different
    # test on each run. Nothing in mosaic imports sqlite3, so imgstore is the
    # only thing this can match.
    "ignore:unclosed database:ResourceWarning",
    # joblib assigns to `ndarray.shape` when unpickling, which NumPy 2.5 deprecated.
    # Third party, reached by every feature that saves a model.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
    # `ffgroups` smooths a padded pairwise-distance stack with a sliding `nanmean`,
    # so a window lying entirely in the NaN pad has nothing to average. NaN is the
    # right answer there, and the warning is numpy narrating it.
    "ignore:Mean of empty slice:RuntimeWarning",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# The vendored Lightning Pose configuration. A data file rather than a module, so
# it is not picked up by `packages.find` and has to be named: without this it is
# present in a checkout and absent from a wheel, which is exactly the deployment
# -- an API or app install -- that needs it most.
[tool.setuptools.package-data]
"mosaic.tracking.litpose.templates" = ["*.yaml"]

# No entry for mosaic-media. It resolves from PyPI like any other dependency,
# which is the only way plain `pip install -e .` can find it: this table is a
# uv extension that pip does not read, so a path source here left the
# requirement above pointing at a package that, to pip, did not exist. To work
# against a local checkout, install it editable over the released wheel --
# `pip install -e ../mosaic-media[io,cli]` -- as CI does.
[tool.uv.sources]
microsoft-python-type-stubs = { git = "https://github.com/microsoft/python-type-stubs" }

[tool.uv.workspace]
exclude = [
    "src/mosaic/behavior/feature_library/external",
    "src/mosaic/tracking/external/ultralytics-env",
    "src/mosaic/tracking/external/polo-env",
]
