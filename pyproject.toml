[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-behavior"
version = "0.11.0"
description = "Mosaic — behavior analysis toolkit for animal tracking, feature extraction, and modeling."
readme = "README.md"
requires-python = ">=3.12"
# PEP 639. The SPDX expression replaces both the deprecated `{ file = ... }`
# table and the `License ::` trove classifier, which cannot coexist with an
# expression -- setuptools raises rather than warns. `license-files` ships both
# documents in the wheel, and every listed file must exist or the build fails.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ecodylic Science" }]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "pyarrow>=11.0",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "numba>=0.58",
    "seaborn>=0.12",
    "matplotlib>=3.7",
    "openTSNE>=0.6",
    "opencv-python>=4.7",
    # `core/annotations/readers/yolo_pose.py` opens each image with PIL to read
    # its size. Core rather than an extra: reading annotations is not gated on
    # any integration, and it arrived only transitively through `ultralytics`,
    # so an install without `pose` met an ImportError on a core path.
    "pillow>=10.0",
    "imbalanced-learn>=0.11",
    "xgboost>=1.7",
    "networkx>=3.2.1",
    "typer>=0.12",
    "mosaic-media[io,cli]>=0.3.0,<0.4.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.38.2",
    "joblib-stubs>=1.4.2.5.20240918",
    "microsoft-python-type-stubs",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "pandas-stubs>=2.2.2.240807",
    "pytest>=8.0",
    "ruff>=0.15.4",
    "scipy-stubs>=1.17.1.1",
]

[project.optional-dependencies]
wavelets = ["PyWavelets>=1.4"]
# `lap` is Ultralytics' linear-assignment solver, imported at module scope by
# `ultralytics.trackers.utils.matching` and reached by every one of the six
# tracker backends. It appears in no Ultralytics extra: without it, Ultralytics
# pip-installs it *during the run*, which is a network write inside a queued job
# and a failure in a locked environment. Declared here so it arrives at install
# time. The `>=8.4.63` floor is where the last four tracker backends
# (ocsort / deepocsort / fasttrack / tracktrack) landed; below it only botsort
# and bytetrack exist.
pose = ["ultralytics>=8.4.63", "lap>=0.5.12"]
# POLO is a full fork and ships the tracker backends its fork point carried, so
# `lap` is needed here for the same reason. The pin stays a bare git reference:
# pairing a direct reference with a version specifier for one distribution is
# unresolvable, which is why the floor above lives on `pose` alone.
polo = [
    "ultralytics @ git+https://github.com/mooch443/POLO.git",
    "lap>=0.5.12",
]
# Ultralytics' optional photometric augmentation block, opt-in and deliberately
# outside `pose` / `polo` / `recommended`.
#
# `albumentations` requires `opencv-python-headless` while mosaic and Ultralytics
# require `opencv-python`. pip installs both without complaint -- they are
# different distributions -- and they then ship the *same* `cv2` import package,
# so one overwrites the other's files and both leave their bundled ffmpeg builds
# in a single `cv2/.dylibs`. Two ffmpeg builds in one process crash it at a
# different point on every run, and whichever wheel wins may be the headless one,
# which has no `imshow`. Declaring it in `pose` therefore made
# `pip install -e ".[recommended]"` produce a broken environment.
#
# Installing this changes what YOLO / POLO training does: Ultralytics builds its
# `Albumentations` transform whenever the package is importable and swallows the
# ImportError when it is not, so with it present a pose run additionally applies
# Blur, MedianBlur, ToGray and CLAHE at p=0.01 each. Mosaic's own presets in
# `tracking/pose_training/augmentation.py` set none of those, and nothing records
# which way a run went -- so the choice belongs to the person installing.
yolo-augment = ["albumentations>=1.3"]
lightning-action = ["lightning-action>=1.0"]
localizer = ["torch>=2.0", "h5py>=3.0"]
# Reading SLEAP output, not running SLEAP. The tracker is an external binary in
# its own environment and mosaic never imports it; what mosaic needs is HDF5, to
# read the analysis `.h5` its converter consumes. Named for the integration
# rather than for the library, like `localizer`.
sleap = ["h5py>=3.0"]
# PyTables, which is what pandas dispatches `read_hdf` to. The DeepLabCut
# converter accepts a `.h5` / `.hdf5` / `.hdf` path, so without this a user with a
# DeepLabCut HDF5 export meets an ImportError from inside pandas, naming a package
# mosaic never mentions.
#
# Named for the format rather than for the tool, unlike `sleap` and `localizer`.
# `[deeplabcut]` would read as "installs DeepLabCut" to a person and to a license
# scanner, and it installs no DeepLabCut code at all: mosaic reads an exported
# file, and a file format carries no license.
#
# Not a duplicate of `sleap`, which also reads HDF5. That one needs `h5py`
# because SLEAP's analysis file is opened directly; this one needs PyTables
# because the DeepLabCut export is opened through pandas. Two libraries, two
# readers, one container format.
hdf5 = ["tables>=3.8"]
# Frozen image-backbone identity models. `identity` covers both: the timm
# backbone loader (`global-identity-embedding`, any timm architecture tag or
# Hugging Face hub id) and the DINOv2 + temporal head. `torch` ships via
# [localizer]/[recommended]; `timm` is what the backbone loader needs. DINOv2
# loads via torch.hub and needs no extra dep. Mosaic distributes no weights --
# each backbone is fetched at run time under its own license.
identity = ["torch>=2.0", "timm>=1.0"]
gpu = ["faiss-cpu>=1.7"]  # use faiss-gpu on Linux+CUDA for GPU-accelerated kNN in global-tsne
# Native imgstore (Motif / Loopbio) video support: directory-based stores work as
# media entries (indexing, reading, tracking inference). Deliberately NOT in
# `recommended` — only needed for imgstore-format recordings.
imgstore = ["imgstore>=0.4"]
# FERAL V-JEPA video behavior classifier (FeralFeature, training + inference),
# from PyPI as of its 1.0.0 release. It was a bare `main` reference before that,
# which is what `polo` still is.
#
# The upper bound is load-bearing rather than cautious. Mosaic builds its own
# training loop out of FERAL's pieces, so it imports thirteen symbols from
# `feral.model`, `feral.dataset`, `feral.utils`, `feral.metrics` and
# `feral.backbones`, and ten of them are submodule internals that FERAL's
# `__all__` does not carry. A major release is free to move any of them.
#
# **This extra wants an environment of its own.** FERAL pins its dependencies
# exactly -- `opencv-python==4.13.0.92`, `pandas`, `scikit-learn`, `timm`,
# `matplotlib`, `transformers` -- and every mosaic requirement is a floor, so pip
# resolves the pair happily and downgrades each one. The opencv pin is the
# damaging one: it lays a wheel over the conda-forge `py-opencv` the documented
# environment installs, which puts a vendored ffmpeg beside conda's `av` and
# reintroduces the crash pitfall 8 in CLAUDE.md exists to prevent. The pins are
# FERAL's own and were the same in the git tree; what the PyPI route changes is
# that `pip install -e ".[feral]"` is now the obvious thing to type.
#
# Deliberately NOT in `recommended` for that reason and for its size.
feral = ["feral>=1.0,<2"]
# Curated bundle for typical research workflows. Excludes `polo` (incompatible
# ultralytics pin with `pose`), `lightning-action` (large standalone dep),
# `gpu` (platform-specific), and `yolo-augment` (it would reintroduce the
# two-OpenCV install this bundle exists to be safe from).
recommended = [
    "PyWavelets>=1.4",
    "ultralytics>=8.4.63",
    "lap>=0.5.12",
    "torch>=2.0",
    "h5py>=3.0",
]

[project.scripts]
mosaic = "mosaic.cli:app"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
executionEnvironments = [
    { root = "src/mosaic/behavior/feature_library/external", extraPaths = ["src/mosaic/behavior/feature_library/external/.venv/lib/python3.13/site-packages"] },
]

[tool.ruff.lint]
# Pinned explicitly rather than inherited. Ruff's default selection is not
# stable across releases -- 0.16 widened it, which took this project from 97
# findings to 865 with no commit -- and CI's lint-changed job runs `uvx ruff
# check`, which always resolves the newest release. An unpinned selection means
# the gate tightens on someone else's release schedule, failing a pull request
# for findings that predate it in a file it merely touched.
#
# This is ruff's pre-0.16 default and reproduces the ~99-finding backlog the
# repository's own notes describe. Widening it is a deliberate change that
# should come with a plan for the backlog it exposes, not a side effect of a
# version bump.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
minversion = "8.0"
# Without this a bare `pytest` walks `notebooks/`, `docs/`, `site/` and the
# keypoint-MoSeq sandbox venv under `feature_library/external/` looking for tests.
testpaths = ["tests"]
# A list rather than one string: the string form nests quotes around `not slow`
# and reads as a single argument that happens to contain a space.
#
# `-m "not slow"` stays here so a bare `pytest` is the fast run CLAUDE.md
# documents. Note that a caller passing its own `-m` *replaces* this one rather
# than intersecting with it -- which is what makes `pytest -m slow` work, and
# also means `pytest -m "not media"` silently re-enables the slow tests.
# `tests/test_pytest_config.py` pins the deselection so that stays deliberate.
addopts = ["-m", "not slow", "-ra", "--strict-markers", "--strict-config"]
# The suite's one xfail already sets strict=True, so this only binds the next
# author: a non-strict xfail passes whether or not the bug it names is fixed.
xfail_strict = true
markers = [
    "slow: takes seconds to minutes; deselected by the default invocation",
    "media: needs the ffmpeg toolchain (both `ffmpeg` and `ffprobe`) on PATH",
    "tracker: exercises an integrated tracker's run loop behind a fake tool",
    "identity: needs torch and timm, i.e. the `identity` extra",
    "feral: needs the feral package, i.e. the `feral` extra",
]
# A warning is a failure, so that the next one becomes visible at the commit that
# introduces it rather than joining a running total nobody reads. The suite emits
# 178 today and they are four things, each listed here with why it is allowed.
filterwarnings = [
    "error",
    # Mosaic's own, and deliberate: a read of an unprocessed original whose verdict
    # requires an analysis transcode. Two tests assert it is raised, so it must stay
    # a warning rather than become an error.
    "default:raw read of:UserWarning",
    # imgstore 0.4 stamps its stores with `datetime.utcnow()`. Third party, on the
    # path of every store this suite builds, and not fixable here.
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
    # joblib assigns to `ndarray.shape` when unpickling, which NumPy 2.5 deprecated.
    # Third party, reached by every feature that saves a model.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
    # `ffgroups` smooths a padded pairwise-distance stack with a sliding `nanmean`,
    # so a window lying entirely in the NaN pad has nothing to average. NaN is the
    # right answer there, and the warning is numpy narrating it.
    "ignore:Mean of empty slice:RuntimeWarning",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# The vendored Lightning Pose configuration. A data file rather than a module, so
# it is not picked up by `packages.find` and has to be named: without this it is
# present in a checkout and absent from a wheel, which is exactly the deployment
# -- an API or app install -- that needs it most.
[tool.setuptools.package-data]
"mosaic.tracking.litpose.templates" = ["*.yaml"]

# No entry for mosaic-media. It resolves from PyPI like any other dependency,
# which is the only way plain `pip install -e .` can find it: this table is a
# uv extension that pip does not read, so a path source here left the
# requirement above pointing at a package that, to pip, did not exist. To work
# against a local checkout, install it editable over the released wheel --
# `pip install -e ../mosaic-media[io,cli]` -- as CI does.
[tool.uv.sources]
microsoft-python-type-stubs = { git = "https://github.com/microsoft/python-type-stubs" }

[tool.uv.workspace]
exclude = [
    "src/mosaic/behavior/feature_library/external",
]
