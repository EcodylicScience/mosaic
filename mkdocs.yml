site_name: Mosaic
site_description: A platform for behavior analysis
site_url: https://ecodylicscience.github.io/mosaic/
repo_url: https://github.com/EcodylicScience/mosaic
repo_name: EcodylicScience/mosaic

# mkdocs derives `edit/master/docs/` from a github.com `repo_url` when this is
# unset, and the default branch here is `main`. Nothing rendered an edit link
# until now -- Material only shows one with `content.action.edit`, enabled
# below -- so setting this and enabling the button are one change, not two.
edit_uri: edit/main/docs/

# What lives under `docs/` and must not be published. Every path here is
# gitignored, and every one of them was being built: a local `site/` indexed
# 1045 documents, the whole internal issue tracker among them, and listed them
# in `sitemap.xml`. No mkdocs default would have caught it, because a page
# absent from `nav` is an INFO and `--strict` only promotes WARNING. A build
# from a clean CI checkout never saw these, which is exactly why the leak could
# sit unnoticed in every local build.
exclude_docs: |
  plans/
  issues/
  specs/
  assessments/
  drafts/

# mkdocs leaves these at INFO, where `--strict` cannot see them. Raised to
# warnings, they make the build fail on a page that is in neither `nav` nor
# `exclude_docs`, and on a link to a heading that has been renamed -- which
# resolves to a 200 and silently lands the reader at the top of the page, so
# nothing else catches it.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # Tabs rather than one flat sidebar, and `navigation.expand` is deliberately
    # absent -- it would open every sub-tree at once, and the generated feature
    # reference alone contributes 45 anchors.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # Pins which copy of the source griffe reads. The handler analyses
          # `src/` statically rather than importing the package, so without this
          # it would document whichever `mosaic` the environment resolved --
          # which is the checkout today only by coincidence of the editable
          # install.
          paths: [src]
          options:
            docstring_style: google
            # Docstring *parsing* warnings are off; every other warning still
            # fails the build under `--strict`. Without this the site cannot be
            # built strictly at all: the tree produces 562 of them, and none
            # describes a broken document.
            #
            # Two pre-existing conventions cause all of it. 280 feature classes
            # document their nested pydantic model under a `Params:` heading,
            # which griffe reads as an alias for `Args:` and then checks against
            # `__init__`, so every field is reported as an undeclared, unannotated
            # parameter. And 122 docstring sections are NumPy-style
            # (`Parameters` over a rule) in a tree configured for Google style,
            # so they parse as prose. Both render imperfectly and neither is a
            # navigation defect, which is what `--strict` is here to catch; the
            # generated reference under `docs/reference/` now carries the
            # authoritative parameter tables regardless. Tracked in
            # `docs/issues/two-docstring-conventions-fight-the-parser.md`.
            docstring_options:
              warnings: false
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  # `attr_list` sizes the hero image and drives Material's `#only-light` /
  # `#only-dark` variants; `md_in_html` lets a `<figure>` wrapper hold markdown.
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

# Named for what a reader is looking for, not for the framework that governs the
# pages. Diataxis is the editorial test -- one reader-need per page, enforced in
# review -- and its own guidance is not to put its vocabulary in the nav: "It
# certainly does not mean that you should create empty structures ... Don't do
# that. It's horrible." Almost all of this content is *doing*, so a literal split
# would give one enormous how-to section beside three thin ones.
#
# Guides follow the three stages of the pipeline diagram -- media, tracking,
# analysis -- with Pipelines as a fourth section rather than a corner of
# Analysis, because a recipe step may be an op as easily as a feature.
nav:
  - Home: index.md
  - Getting Started:
      - Install mosaic: installation.md
      - The mosaic dataset: dataset.md
  - Guides:
      - Overview: guides/index.md
      - Tracking:
          - Import tracks you already have: guides/tracking/import.md
          - Run a tracker: guides/tracking/run-a-tracker.md
          - Train a pose model: guides/tracking/train-a-pose-model.md
          - Write a converter for your format: guides/tracking/write-a-converter.md
      - Analysis:
          - Features: guides/analysis/features.md
          - Write your own feature: guides/analysis/write-your-own-feature.md
          - Unsupervised and supervised models: guides/analysis/models.md
      - Pipelines:
          - Chain steps into a recipe: guides/pipelines/chain-steps.md
          - Run work and see what ran: guides/pipelines/run-and-see-what-ran.md
          - Keep a dataset organized: guides/pipelines/keep-organized.md
  - Concepts:
      - Datasets, roots and sources: concepts/datasets.md
      - What a tracker reports: concepts/tracks.md
      - Features and composition: concepts/features.md
      - Reproducibility and caching: concepts/reproducibility.md
      - Pipelines as documents: concepts/pipelines.md
  - Reference:
      - What is where: reference/index.md
      - Registries:
          - Features: reference/features.md
          - Ops: reference/ops.md
          - CLI: reference/cli.md
          - Track formats: reference/track-formats.md
      - Python API:
          - Dataset: api/core/dataset.md
          - Manifest: api/core/manifest.md
          - Typed attributes: api/core/typed-attribute.md
          - Schema: api/core/schema.md
          - Helpers: api/core/helpers.md
          - Pipeline: api/pipeline/index.md
          - Inventory: api/pipeline/inventory.md
          - Graphs: api/pipeline/graph.md
          - Feature library: api/behavior/feature-library.md
          - Label library: api/behavior/label-library.md
          - Visualization: api/behavior/visualization.md
          - Video I/O: api/media/video-io.md
          - Frame extraction: api/tracking/frame-extraction.md
          - Pose training: api/tracking/pose-training.md
