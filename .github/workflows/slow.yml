name: Slow tests

# The slow tests that no job marker claims. `ci.yml`'s `test` job deselects
# `slow` so a push stays quick, and each marked job (`identity`, `tracking`,
# `feral`) runs its own slow tests, so without this workflow the rest would run
# nowhere but on a developer's machine. `tests/test_pytest_config.py` holds the
# two workflows to that partition.
#
# A workflow of its own rather than a job in `ci.yml`: that workflow cancels an
# in-progress run on the same ref, so a push to `main` would cancel a scheduled
# run there.

on:
  schedule:
    # Mondays at 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: mosaic

      - uses: actions/checkout@v4
        with:
          repository: EcodylicScience/mosaic-media
          path: mosaic-media

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # As `ci.yml`'s `test` job installs, for the reasons given there.
      - name: Install
        working-directory: mosaic
        run: |
          uv venv
          uv pip install -e '../mosaic-media[io,cli]'
          uv pip install -e '.'
          uv pip install --group test

      - name: Test
        working-directory: mosaic
        env:
          PYTHONHASHSEED: random
        run: uv run --no-sync pytest -q -m "slow and not tracker and not identity and not feral" --durations=25
