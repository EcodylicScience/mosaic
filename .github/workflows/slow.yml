name: Slow tests

# The slow tests that no job marker claims. `ci.yml`'s `test` job deselects
# `slow` so a push stays quick, and each marked job (`identity`, `tracking`,
# `feral`) runs its own slow tests, so without this workflow the rest would run
# nowhere but on a developer's machine. `tests/meta/test_pytest_config.py` holds the
# two workflows to that partition.
#
# A workflow of its own rather than a job in `ci.yml`: that workflow cancels an
# in-progress run on the same ref, so a push to `main` would cancel a scheduled
# run there.
#
# It also builds the VAME environment, which the VAME integration tests run
# against. A build downloads about 3.4 GB of CUDA wheels, too much for every
# push, and the tests are slow and claimed by no job marker.

on:
  schedule:
    # Mondays at 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  slow:
    runs-on: ubuntu-latest
    # Long enough for the VAME environment's build as well as the tests.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: mosaic

      - uses: actions/checkout@v4
        with:
          repository: EcodylicScience/mosaic-media
          path: mosaic-media

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # As `ci.yml`'s `test` job installs, for the reasons given there.
      - name: Install
        working-directory: mosaic
        run: |
          uv venv
          uv pip install -e '../mosaic-media[io,cli]'
          uv pip install -e '.'
          uv pip install --group test

      # Built as a user builds it, from the committed lock. The integration
      # tests train on the CPU.
      - name: Build the VAME environment
        working-directory: mosaic/src/mosaic/behavior/feature_library/external/vame-env
        run: uv sync --python 3.12

      - name: Test
        working-directory: mosaic
        env:
          PYTHONHASHSEED: random
          # With it set, the suite refuses to start when the VAME environment
          # does not resolve. The integration tests would otherwise skip.
          MOSAIC_CI_VAME: "1"
          MOSAIC_VAME_PYTHON: ${{ github.workspace }}/mosaic/src/mosaic/behavior/feature_library/external/vame-env/.venv/bin/python
        run: uv run --no-sync pytest -q -m "slow and not tracker and not identity and not feral and not lightning_action and not hidra" --durations=25
