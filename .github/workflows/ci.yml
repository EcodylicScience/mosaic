name: CI

# Gates on the test suite, and on lint for the files a pull request touches.
#
# Deliberately NOT gating on project-wide `ruff check`, `ruff format --check`, or
# `basedpyright`: all three carry a large pre-existing backlog (99 lint findings,
# 89 files pending a format pass, ~9k strict-mode type errors). Making any of
# them a gate would put CI permanently red, which trains everyone to ignore it.
# Scoping lint to changed files encodes the rule the repository actually follows
# -- new and touched code is clean -- and ratchets on its own. Adding a
# project-wide type gate needs the backlog paid down first.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # mosaic-media resolves from PyPI, so nothing here needs the sibling to
      # install. It is checked out and installed editable anyway, over the
      # released wheel, so the suite runs against unreleased mosaic-media and a
      # regression there surfaces before it reaches a tag rather than after.
      - uses: actions/checkout@v4
        with:
          path: mosaic

      # No `token:`. mosaic-media is public, so the default `github.token` can
      # read it. Naming a secret that does not exist is worse than naming none:
      # an undefined secret expands to the empty string, and checkout rejects
      # that outright ("Input required and not supplied: token"), so the job
      # died before installing anything.
      - uses: actions/checkout@v4
        with:
          repository: EcodylicScience/mosaic-media
          path: mosaic-media

      # ffprobe is a hard runtime dependency of media indexing and raw-H.264
      # frame counting, and it is not on the runner image. Without it, indexing
      # does not fail loudly -- it writes rows that lack the probed facts, so
      # the damage surfaces far downstream as KeyError, `assert 0 == 1` and
      # StopIteration in tests that never mention ffprobe.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        working-directory: mosaic
        run: |
          uv venv
          # `uv pip install`, not `uv sync`: the lock cannot resolve on every
          # platform, because `lightning-action` pulls `nvidia-dali-cuda110`,
          # which publishes nothing for macOS. `uv sync` would also install
          # without extras and prune what it considers extraneous, undoing the
          # two installs below.
          uv pip install -e '../mosaic-media[io,cli]'
          uv pip install -e '.[wavelets,imgstore,sleap]'
          uv pip install pytest ruff

      - name: Test
        working-directory: mosaic
        env:
          # Surfaces any identity term that is order-dependent rather than
          # ordered, which a single fixed seed would hide.
          PYTHONHASHSEED: random
        # `--no-sync` is load-bearing. `uv run` syncs the project environment
        # from the tracked `uv.lock` by default, which installs the project
        # *without* extras and prunes what it considers extraneous -- undoing
        # the `[wavelets,imgstore]` install above. `pytest` survives only
        # because it is in `[dependency-groups] dev`, so the loss is invisible:
        # the 35 imgstore tests reach `pytest.importorskip` and skip, and CI
        # reports green while running less than this workflow installs for.
        run: uv run --no-sync pytest -q

  # The identity tests need torch and timm, ~200 MB of wheels that nothing else
  # in the suite requires. Their own job keeps `test` fast while still making
  # them real evidence: `pytest.importorskip` would otherwise skip them green,
  # and they are the only guard on a checkpoint still loading into the network
  # that wrote it. A frozen-backbone checkpoint stores the head alone, so a
  # reload that tolerated missing weights would yield a random backbone --
  # which predicts happily and is wrong.
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mosaic

      - uses: actions/checkout@v4
        with:
          repository: EcodylicScience/mosaic-media
          path: mosaic-media

      # conftest's CI guard covers the whole suite's required modules and
      # binaries, so this job matches `test`'s environment and adds to it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        working-directory: mosaic
        run: |
          uv venv
          uv pip install -e '../mosaic-media[io,cli]'
          uv pip install -e '.[wavelets,imgstore,sleap,identity]'
          uv pip install pytest

      - name: Test identity checkpoints
        working-directory: mosaic
        env:
          PYTHONHASHSEED: random
          # Promotes a missing torch from "skip" to "broken environment".
          MOSAIC_CI_IDENTITY: "1"
        # `-m "slow or not slow"` because the tests that construct a real
        # backbone are slow-marked, and those are the ones this job exists for.
        run: |
          uv run --no-sync pytest -q -m "slow or not slow" \
            tests/test_identity_classifier.py \
            tests/test_identity_embedding_backbone.py \
            tests/test_behavior_import_is_torch_free.py \
            tests/test_identity_model_artifact.py \
            tests/test_identity_golden.py

  lint-changed:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Lint the files this pull request touches
        run: |
          base="origin/${{ github.base_ref }}"
          mapfile -t changed < <(
            git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.py'
          )
          if [ ${#changed[@]} -eq 0 ]; then
            echo "No Python files changed."
            exit 0
          fi
          printf 'Checking:\n%s\n' "${changed[*]}"
          uvx ruff check "${changed[@]}"
          uvx ruff format --check "${changed[@]}"
