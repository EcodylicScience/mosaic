name: CI

# Gates on the test suite and on project-wide lint.
#
# `ruff` is a gate over the whole tree, not over the files a pull request happens
# to touch. It was scoped to changed files while a backlog existed; that backlog
# is paid down (formatting is clean tree-wide and `ruff check` finds nothing), so
# the scoping now only costs coverage. It also never ran: the changed-files job
# was `pull_request`-only and this repository pushes to `main`, so across its
# first 22 runs it executed once. Lint runs on push for that reason.
#
# The rules ruff enforces are worth the gate beyond style: `F821` catches a name
# that does not resolve, which is what a stray edit at module scope produces, and
# a collection-time `NameError` takes the whole test job with it.
#
# Still NOT gated: `basedpyright`. Strict mode reports ~11k errors against this
# tree, so making it a gate would put CI permanently red, which trains everyone
# to ignore it. That one needs the backlog paid down first.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # mosaic-media resolves from PyPI, so nothing here needs the sibling to
      # install. It is checked out and installed editable anyway, over the
      # released wheel, so the suite runs against unreleased mosaic-media and a
      # regression there surfaces before it reaches a tag rather than after.
      - uses: actions/checkout@v4
        with:
          path: mosaic

      # No `token:`. mosaic-media is public, so the default `github.token` can
      # read it. Naming a secret that does not exist is worse than naming none:
      # an undefined secret expands to the empty string, and checkout rejects
      # that outright ("Input required and not supplied: token"), so the job
      # died before installing anything.
      - uses: actions/checkout@v4
        with:
          repository: EcodylicScience/mosaic-media
          path: mosaic-media

      # ffprobe is a hard runtime dependency of media indexing and raw-H.264
      # frame counting, and it is not on the runner image. Without it, indexing
      # does not fail loudly -- it writes rows that lack the probed facts, so
      # the damage surfaces far downstream as KeyError, `assert 0 == 1` and
      # StopIteration in tests that never mention ffprobe.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        working-directory: mosaic
        run: |
          uv venv
          # `uv pip install`, not `uv sync`: the lock cannot resolve on every
          # platform, because `lightning-action` pulls `nvidia-dali-cuda110`,
          # which publishes nothing for macOS. `uv sync` would also install
          # without extras and prune what it considers extraneous, undoing the
          # two installs below.
          uv pip install -e '../mosaic-media[io,cli]'
          uv pip install -e '.'
          # `imgstore` and the runner arrive through the `test` group, which
          # every job installs: conftest demands imgstore of any run with CI
          # set, so a job without it fails at collection.
          uv pip install --group test
          uv pip install ruff

      - name: Test
        working-directory: mosaic
        env:
          # Surfaces any identity term that is order-dependent rather than
          # ordered, which a single fixed seed would hide.
          PYTHONHASHSEED: random
        # `--no-sync` is load-bearing. `uv run` syncs the project environment
        # from the tracked `uv.lock` by default, which installs the project
        # *without* extras or groups and prunes what it considers extraneous --
        # undoing the `--group test` install above. The loss would be invisible:
        # the imgstore tests reach `pytest.importorskip` and skip, and CI reports
        # green while running less than this workflow installs for. (The lock is
        # also stale and cannot currently be regenerated; see CONTRIBUTING.md.)
        run: uv run --no-sync pytest -q

  # The identity tests need torch and timm, via the `deep-learning` extra, which
  # nothing else
  # in the suite requires. Their own job keeps `test` fast while still making
  # them real evidence: `pytest.importorskip` would otherwise skip them green,
  # and they are the only guard on a checkpoint still loading into the network
  # that wrote it. A frozen-backbone checkpoint stores the head alone, so a
  # reload that tolerated missing weights would yield a random backbone --
  # which predicts happily and is wrong.
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mosaic

      - uses: actions/checkout@v4
        with:
          repository: EcodylicScience/mosaic-media
          path: mosaic-media

      # conftest's CI guard covers the whole suite's required modules and
      # binaries, so this job matches `test`'s environment and adds to it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        working-directory: mosaic
        run: |
          uv venv
          uv pip install -e '../mosaic-media[io,cli]'
          uv pip install -e '.[deep-learning]'
          uv pip install --group test

      - name: Test identity checkpoints
        working-directory: mosaic
        env:
          PYTHONHASHSEED: random
          # Promotes a missing torch from "skip" to "broken environment".
          MOSAIC_CI_IDENTITY: "1"
        # `-m identity` rather than a list of filenames: the list was a second
        # place to remember, and a new identity test file was invisible to CI
        # until someone edited this workflow. It also *replaces* the `-m "not
        # slow"` in `addopts`, which is what this job needs -- the tests that
        # construct a real backbone are slow-marked, and they are the ones it
        # exists for.
        run: uv run --no-sync pytest -q -m identity

  tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mosaic

      - uses: actions/checkout@v4
        with:
          repository: EcodylicScience/mosaic-media
          path: mosaic-media

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # Plainly, with no `pose` extra: Ultralytics is AGPL-3.0 and mosaic never
      # imports it, which `test_ultralytics_separation.py` is what enforces.
      # Installing it here would put it one careless import away from being true
      # again, and would buy nothing -- nothing in mosaic's environment loads it.
      - name: Install
        working-directory: mosaic
        run: |
          uv venv
          uv pip install -e '../mosaic-media[io,cli]'
          uv pip install -e '.'
          uv pip install --group test

      # The environment Ultralytics actually runs in, built exactly as a user
      # builds it. This is what the preflight suite compares mosaic's declared
      # tracker tables against; without it that comparison skips, and the job
      # would prove nothing about the defaults it exists to hold still.
      - name: Build the Ultralytics environment
        working-directory: mosaic/src/mosaic/tracking/external/ultralytics-env
        run: uv sync --python 3.12

      # POLO beside it, and not in it: the fork ships under the distribution name
      # `ultralytics`, so an environment holds one or the other. `infer-points`
      # runs the fork, and until it had an environment of its own nothing in CI
      # had ever executed that path -- no job installed the `polo` extra.
      - name: Build the POLO environment
        working-directory: mosaic/src/mosaic/tracking/external/polo-env
        run: uv sync --python 3.12

      - name: Test ultralytics tracking
        working-directory: mosaic
        env:
          PYTHONHASHSEED: random
          # Promotes an external environment that does not resolve from "skip"
          # to "broken environment", for both of them.
          MOSAIC_CI_TRACKING: "1"
          MOSAIC_ULTRALYTICS_BIN: ${{ github.workspace }}/mosaic/src/mosaic/tracking/external/ultralytics-env/.venv/bin/yolo
          # Named explicitly, never left to $PATH: the fork installs the same
          # `yolo` script as upstream, so the last rung of the location ladder
          # cannot tell the two apart and would hand point detection to whichever
          # is found first.
          MOSAIC_POLO_BIN: ${{ github.workspace }}/mosaic/src/mosaic/tracking/external/polo-env/.venv/bin/yolo
        # `-m tracker` for the same reason as the identity job above.
        run: uv run --no-sync pytest -q -m tracker

  # FERAL is a moving target mosaic reaches deep into: the feature builds its own
  # training loop out of thirteen symbols from `feral.model`, `feral.dataset`,
  # `feral.utils`, `feral.metrics` and `feral.backbones`, and ten of those are
  # submodule internals the package's `__all__` does not carry and its authors owe
  # nobody. This job is what turns a release that moves one of them red here
  # rather than on someone's GPU box mid-run.
  #
  # It is deliberately the last job of its kind rather than a line added to
  # `test`: FERAL pins its dependencies exactly -- `opencv-python`, `pandas`,
  # `scikit-learn`, `timm`, `matplotlib`, `transformers` -- so installing it beside
  # the other extras would silently re-resolve the environment every other job
  # shares. On its own runner those pins win uncontested, and its single
  # `opencv-python` build keeps conftest's two-builds guard satisfied.
  feral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mosaic

      - uses: actions/checkout@v4
        with:
          repository: EcodylicScience/mosaic-media
          path: mosaic-media

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        working-directory: mosaic
        run: |
          uv venv
          uv pip install -e '../mosaic-media[io,cli]'
          uv pip install -e '.[feral]'
          uv pip install --group test

      - name: Test feral integration
        working-directory: mosaic
        env:
          PYTHONHASHSEED: random
          # Promotes a missing feral from "skip" to "broken environment". The
          # guard is a `find_spec` probe rather than `importorskip`, because the
          # same file also asserts the ImportError raised in feral's absence.
          MOSAIC_CI_FERAL: "1"
        # `-m feral` for the same reason as the identity job above.
        run: uv run --no-sync pytest -q -m feral

  # Runs on push as well as on pull request. `uvx` resolves the newest ruff at
  # run time, so a rule set widening upstream surfaces here rather than on
  # whichever machine happens to upgrade first; `[tool.ruff.lint] select` in
  # pyproject pins which rules are in force against that drift.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # `src/` and `tests/` rather than `.`: the notebooks under `notebooks/` are
      # worked examples that carry unused imports and re-imports on purpose, and
      # linting them would gate the suite on prose rather than on code.
      - name: Lint
        run: |
          uvx ruff check src tests
          uvx ruff format --check src tests
