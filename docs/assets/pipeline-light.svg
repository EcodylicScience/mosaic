<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" width="880" height="366" role="img" aria-labelledby="mosaic-pipeline-title mosaic-pipeline-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="mosaic-pipeline-title">The mosaic pipeline</title>
  <desc id="mosaic-pipeline-desc">Video goes to trackers, which mosaic drives, and their output becomes one standardized tracks table. From there mosaic computes features, fits models, and renders annotated video. Pose models trained in mosaic feed the trackers.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/>
    </marker>
  </defs>

  <g stroke-width="1.5">
    <!-- Row 1: video, the trackers mosaic drives, the standardized table -->
    <rect x="20" y="30" width="170" height="72" rx="8" fill="#f4f6f8" stroke="#9aa5b1"/>
    <text x="105" y="59" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933" stroke="none">Video</text>
    <text x="105" y="79" text-anchor="middle" font-size="11" fill="#52606d" stroke="none">mp4 · raw h264 · imgstore</text>

    <rect x="250" y="30" width="300" height="72" rx="8" fill="#f4f6f8" stroke="#9aa5b1"/>
    <text x="400" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933" stroke="none">Trackers</text>
    <text x="400" y="73" text-anchor="middle" font-size="11" fill="#52606d" stroke="none">TRex · SLEAP · DeepLabCut</text>
    <text x="400" y="89" text-anchor="middle" font-size="11" fill="#52606d" stroke="none">Lightning Pose · Ultralytics</text>

    <rect x="630" y="30" width="230" height="72" rx="8" fill="#e6f4f1" stroke="#00897b"/>
    <text x="745" y="59" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933" stroke="none">Tracks</text>
    <text x="745" y="79" text-anchor="middle" font-size="11" fill="#52606d" stroke="none">one validated schema</text>

    <!-- Pose models trained in mosaic, feeding the trackers above -->
    <rect x="250" y="136" width="300" height="46" rx="8" fill="#e6f4f1" stroke="#00897b"/>
    <text x="400" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933" stroke="none">Pose models</text>
    <text x="400" y="172" text-anchor="middle" font-size="11" fill="#52606d" stroke="none">YOLO · POLO · localizer, trained in mosaic</text>

    <!-- Row 2: what mosaic computes from the table -->
    <rect x="20" y="250" width="270" height="72" rx="8" fill="#e6f4f1" stroke="#00897b"/>
    <text x="155" y="279" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933" stroke="none">Features</text>
    <text x="155" y="299" text-anchor="middle" font-size="11" fill="#52606d" stroke="none">45 registered · kinematic, social, spectral</text>

    <rect x="340" y="250" width="270" height="72" rx="8" fill="#e6f4f1" stroke="#00897b"/>
    <text x="475" y="279" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933" stroke="none">Models</text>
    <text x="475" y="299" text-anchor="middle" font-size="11" fill="#52606d" stroke="none">t-SNE · AR-HMM · XGBoost</text>

    <rect x="660" y="250" width="200" height="72" rx="8" fill="#e6f4f1" stroke="#00897b"/>
    <text x="760" y="279" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933" stroke="none">Annotated video</text>
    <text x="760" y="299" text-anchor="middle" font-size="11" fill="#52606d" stroke="none">overlays · crops</text>

    <!-- Flow -->
    <path d="M 194 66 L 242 66" fill="none" stroke="#9aa5b1" marker-end="url(#arrow)"/>
    <path d="M 554 66 L 622 66" fill="none" stroke="#9aa5b1" marker-end="url(#arrow)"/>
    <path d="M 400 132 L 400 110" fill="none" stroke="#9aa5b1" marker-end="url(#arrow)"/>
    <path d="M 745 106 L 745 206 L 155 206 L 155 242" fill="none" stroke="#9aa5b1" marker-end="url(#arrow)"/>
    <path d="M 294 286 L 332 286" fill="none" stroke="#9aa5b1" marker-end="url(#arrow)"/>
    <path d="M 614 286 L 652 286" fill="none" stroke="#9aa5b1" marker-end="url(#arrow)"/>
  </g>

  <text x="440" y="350" text-anchor="middle" font-size="11" font-style="italic" fill="#52606d">every result content-addressed by run_id, so a re-run is a no-op</text>
</svg>
