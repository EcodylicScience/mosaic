       id="arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#7b8794"
         id="path1" />
    </marker>
  </defs>
  <g
     stroke-width="1.5"
     id="g30">
    <!-- Way in, first: video through a tracker mosaic runs -->
    <rect
       x="20"
