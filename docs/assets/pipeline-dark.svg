  <title
     id="mosaic-pipeline-title">The mosaic pipeline</title>
  <desc
     id="mosaic-pipeline-desc">Two ways in, one table out. Video feeds the trackers mosaic runs; tracks produced by other tools are imported instead. Both arrive as one standardized tracks table, which feeds an analysis stage where individual, pair and group features compose with unsupervised and supervised models. Pose models trained in mosaic feed the trackers.</desc>
